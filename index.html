<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakery POS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f3ef;
  color:#222;
}

header{
  background:#7b3f2f;
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:20px;
}

.sales{
  font-size:14px;
}

.container{
  display:flex;
  min-height:calc(100vh - 60px);
}

.products{
  flex:1;
  padding:15px;
}

.products h2{
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px;
}

.product{
  background:white;
  border-radius:14px;
  padding:18px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.15s;
}

.product:active{
  transform:scale(.96);
}

.product .emoji{
  font-size:34px;
  margin-bottom:8px;
}

.product h3{
  font-size:15px;
  margin-bottom:5px;
}

.price{
  color:#7b3f2f;
  font-weight:bold;
}

.cart{
  width:360px;
  background:white;
  border-left:1px solid #ddd;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.cart h2{
  margin-bottom:15px;
}

.cart-items{
  flex:1;
  overflow:auto;
}

.empty{
  text-align:center;
  color:#888;
  margin-top:40px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.item-info{
  flex:1;
}

.item-name{
  font-weight:bold;
}

.item-price{
  font-size:13px;
  color:#777;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  border:0;
  background:#eee;
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
}

.summary{
  border-top:1px solid #ddd;
  padding-top:15px;
  margin-top:15px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.payment-title{
  font-weight:bold;
  margin-bottom:8px;
}

.payment{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.payment button{
  padding:12px 5px;
  border:1px solid #ddd;
  background:white;
  border-radius:10px;
  cursor:pointer;
}

.payment button.active{
  background:#7b3f2f;
  color:white;
  border-color:#7b3f2f;
}

.checkout{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#222;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.checkout:disabled{
  background:#bbb;
}

@media(max-width:800px){
  .container{
    flex-direction:column;
  }

  .cart{
    width:100%;
    border-left:0;
    border-top:1px solid #ddd;
    min-height:400px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🍰 Bakery POS</h1>
  <div class="sales">
    Today's Sales: <strong id="todaySales">MVR 0.00</strong>
  </div>
</header>

<div class="container">

  <section class="products">
    <h2>Products</h2>

    <div class="grid" id="productGrid"></div>
  </section>

  <section class="cart">

    <h2>Current Order</h2>

    <div class="cart-items" id="cartItems">
      <div class="empty">No products added</div>
    </div>

    <div class="summary">

      <div class="total">
        <span>Total</span>
        <span id="total">MVR 0.00</span>
      </div>

      <div class="payment-title">
        Payment Method
      </div>

      <div class="payment">

        <button onclick="selectPayment('Cash')" id="cash">
          💵 Cash
        </button>

        <button onclick="selectPayment('Card')" id="card">
          💳 Card
        </button>

        <button onclick="selectPayment('Transfer')" id="transfer">
          🏦 Transfer
        </button>

      </div>

      <button class="checkout" id="checkout" onclick="checkout()" disabled>
        Complete Order
      </button>

    </div>

  </section>

</div>

<script>

const products = [
  {id:1,name:"Chocolate Cake",price:120,emoji:"🍰"},
  {id:2,name:"Croissant",price:45,emoji:"🥐"},
  {id:3,name:"Chicken Burger",price:95,emoji:"🍔"},
  {id:4,name:"Pizza",price:150,emoji:"🍕"},
  {id:5,name:"French Fries",price:55,emoji:"🍟"},
  {id:6,name:"Coffee",price:35,emoji:"☕"},
  {id:7,name:"Fresh Juice",price:50,emoji:"🥤"},
  {id:8,name:"Sandwich",price:70,emoji:"🥪"}
];

let cart = [];
let paymentMethod = null;

let todaySales =
  Number(localStorage.getItem("todaySales")) || 0;

document.getElementById("todaySales").innerText =
  "MVR " + todaySales.toFixed(2);

function renderProducts(){

  const grid = document.getElementById("productGrid");

  grid.innerHTML = "";

  products.forEach(product => {

    const div = document.createElement("div");

    div.className = "product";

    div.onclick = () => addToCart(product.id);

    div.innerHTML = `
      <div class="emoji">${product.emoji}</div>
      <h3>${product.name}</h3>
      <div class="price">MVR ${product.price.toFixed(2)}</div>
    `;

    grid.appendChild(div);

  });
}

function addToCart(id){

  const product = products.find(p => p.id === id);

  const existing = cart.find(item => item.id === id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      ...product,
      qty:1
    });
  }

  renderCart();
}

function changeQty(id,change){

  const item = cart.find(i => i.id === id);

  if(!item) return;

  item.qty += change;

  if(item.qty <= 0){
    cart = cart.filter(i => i.id !== id);
  }

  renderCart();
}

function renderCart(){

  const container = document.getElementById("cartItems");

  if(cart.length === 0){

    container.innerHTML =
      `<div class="empty">No products added</div>`;

  }else{

    container.innerHTML = cart.map(item => `

      <div class="cart-item">

        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price">
            MVR ${(item.price * item.qty).toFixed(2)}
          </div>
        </div>

        <div class="qty">

          <button onclick="changeQty(${item.id},-1)">
            −
          </button>

          <span>${item.qty}</span>

          <button onclick="changeQty(${item.id},1)">
            +
          </button>

        </div>

      </div>

    `).join("");

  }

  updateTotal();
}

function getTotal(){

  return cart.reduce(
    (sum,item) => sum + item.price * item.qty,
    0
  );

}

function updateTotal(){

  const total = getTotal();

  document.getElementById("total").innerText =
    "MVR " + total.toFixed(2);

  document.getElementById("checkout").disabled =
    cart.length === 0 || paymentMethod === null;

}

function selectPayment(method){

  paymentMethod = method;

  document
    .querySelectorAll(".payment button")
    .forEach(button => button.classList.remove("active"));

  document
    .getElementById(method.toLowerCase())
    .classList.add("active");

  updateTotal();
}

function checkout(){

  if(cart.length === 0 || !paymentMethod){
    return;
  }

  const total = getTotal();

  todaySales += total;

  localStorage.setItem(
    "todaySales",
    todaySales
  );

  alert(
    "Order completed!\\n\\n" +
    "Total: MVR " + total.toFixed(2) +
    "\\nPayment: " + paymentMethod
  );

  cart = [];
  paymentMethod = null;

  document
    .querySelectorAll(".payment button")
    .forEach(button => button.classList.remove("active"));

  document.getElementById("todaySales").innerText =
    "MVR " + todaySales.toFixed(2);

  renderCart();
}

renderProducts();
renderCart();

</script>

</body>
</html>
