<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bakery POS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f6f3ef;color:#222}
header{background:#7b3f2f;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd;overflow:auto}
nav button{flex:1;min-width:100px;padding:13px;border:0;background:#fff;font-weight:bold}
nav button.active{color:#7b3f2f;border-bottom:3px solid #7b3f2f}
.page{display:none;padding:15px}
.page.active{display:block}
.layout{display:grid;grid-template-columns:1fr 360px;gap:15px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.product,.cart,.admin-form,.stat,.order{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0001}
.product{cursor:pointer}
.product.sold{opacity:.4;cursor:not-allowed}
.emoji{font-size:32px;margin-bottom:7px}
.product h3{font-size:15px;margin-bottom:5px}
.price{color:#7b3f2f;font-weight:bold}
.cart-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:11px 0}
.item-info{flex:1}
.item-name{font-weight:bold}
.item-price{font-size:13px;color:#777}
.qty{display:flex;align-items:center;gap:7px}
.qty button{border:0;background:#eee;width:28px;height:28px;border-radius:50%}
.summary{border-top:1px solid #ddd;margin-top:15px;padding-top:15px}
.total{display:flex;justify-content:space-between;font-size:21px;font-weight:bold;margin-bottom:12px}
.payment{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.payment button{padding:11px;border:1px solid #ddd;background:#fff;border-radius:9px}
.payment button.active{background:#7b3f2f;color:#fff}
.checkout,.primary{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:bold}
.checkout:disabled{background:#aaa}
input,select{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ddd;border-radius:9px}
.form-btn{background:#7b3f2f;color:#fff;border:0;padding:11px 16px;border-radius:9px;font-weight:bold}
.product-list,.orders{display:grid;gap:10px;margin-top:12px}
.admin-product,.order{display:flex;align-items:center;justify-content:space-between;gap:10px}
.admin-actions button,.order button{border:0;padding:8px;border-radius:7px;margin-left:4px}
.edit{background:#eee}.delete{background:#fee}.sold-btn{background:#fff0c2}
.empty{text-align:center;color:#888;padding:30px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat small{color:#777}
.stat strong{display:block;font-size:22px;margin-top:7px}
.order{display:block}
.order-top{display:flex;justify-content:space-between;gap:10px}
.order-items{font-size:14px;color:#666;margin:8px 0}
.order-bottom{display:flex;justify-content:space-between;align-items:center}
.receipt{max-width:380px;margin:auto;background:#fff;padding:25px;text-align:center}
.receipt-items{text-align:left;margin:20px 0}
.receipt-row{display:flex;justify-content:space-between;margin:6px 0}
.receipt-total{border-top:1px dashed #777;padding-top:10px;font-size:20px;font-weight:bold}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:15px;padding:15px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal-buttons{display:flex;gap:8px;margin-top:15px}
.modal-buttons button{flex:1;padding:12px;border:0;border-radius:9px;font-weight:bold}
.close{background:#eee}
.print{background:#7b3f2f;color:#fff}
@media(max-width:800px){
.layout{grid-template-columns:1fr}
.stat-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:450px){
.stat-grid{grid-template-columns:1fr 1fr}
}
@media print{
body *{visibility:hidden}
#printArea,#printArea *{visibility:visible}
#printArea{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>

<body>

<header>
<h1>🍰 Bakery POS</h1>
<div>Sales: <strong id="headerSales">MVR 0.00</strong></div>
</header>

<nav>
<button class="active" onclick="showPage('pos',this)">🧾 POS</button>
<button onclick="showPage('admin',this)">⚙️ Admin</button>
<button onclick="showPage('dashboard',this)">📊 Dashboard</button>
<button onclick="showPage('history',this)">📜 History</button>
</nav>

<!-- POS -->
<section id="pos" class="page active">

<div class="layout">

<div>
<h2 style="margin-bottom:14px">Products</h2>
<div class="products-grid" id="productGrid"></div>
</div>

<div class="cart">

<h2>Current Order</h2>

<div id="cartItems">
<div class="empty">No products added</div>
</div>

<div class="summary">

<div class="total">
<span>Total</span>
<span id="total">MVR 0.00</span>
</div>

<strong>Payment Method</strong>

<div class="payment" style="margin-top:8px">
<button onclick="selectPayment('Cash')" id="cash">💵 Cash</button>
<button onclick="selectPayment('Card')" id="card">💳 Card</button>
<button onclick="selectPayment('Transfer')" id="transfer">🏦 Transfer</button>
</div>

<button class="checkout" id="checkout" onclick="checkout()" disabled>
Complete Order
</button>

</div>
</div>

</div>
</section>

<!-- ADMIN -->
<section id="admin" class="page">

<h2 style="margin-bottom:15px">⚙️ Product Management</h2>

<div class="admin-form">

<h3>Add New Product</h3>

<input id="newName" placeholder="Product name">
<input id="newPrice" type="number" placeholder="Price">

<select id="newCategory">
<option>Bakery</option>
<option>Food</option>
<option>Drinks</option>
<option>Desserts</option>
<option>Other</option>
</select>

<input id="newEmoji" placeholder="Emoji e.g. 🍰">

<button class="form-btn" onclick="addProduct()">+ Add Product</button>

</div>

<h3>Your Products</h3>
<div class="product-list" id="adminProducts"></div>

</section>

<!-- DASHBOARD -->
<section id="dashboard" class="page">

<h2 style="margin-bottom:15px">📊 Dashboard</h2>

<div class="stat-grid">

<div class="stat">
<small>Today's Sales</small>
<strong id="dashSales">MVR 0.00</strong>
</div>

<div class="stat">
<small>Orders Today</small>
<strong id="dashOrders">0</strong>
</div>

<div class="stat">
<small>Cash</small>
<strong id="dashCash">MVR 0.00</strong>
</div>

<div class="stat">
<small>Card</small>
<strong id="dashCard">MVR 0.00</strong>
</div>

<div class="stat">
<small>Transfer</small>
<strong id="dashTransfer">MVR 0.00</strong>
</div>

<div class="stat">
<small>Products</small>
<strong id="dashProducts">0</strong>
</div>

</div>

</section>

<!-- HISTORY -->
<section id="history" class="page">

<h2>📜 Order History</h2>

<div class="orders" id="orders"></div>

</section>

<!-- RECEIPT MODAL -->
<div class="modal" id="receiptModal">

<div class="modal-box">

<div id="printArea"></div>

<div class="modal-buttons">
<button class="close" onclick="closeReceipt()">Close</button>
<button class="print" onclick="printReceipt()">🖨️ Print</button>
</div>

</div>

</div>

<script>

const defaultProducts=[
{id:1,name:"Chocolate Cake",price:120,category:"Bakery",emoji:"🍰",available:true},
{id:2,name:"Croissant",price:45,category:"Bakery",emoji:"🥐",available:true},
{id:3,name:"Chicken Burger",price:95,category:"Food",emoji:"🍔",available:true},
{id:4,name:"Pizza",price:150,category:"Food",emoji:"🍕",available:true},
{id:5,name:"French Fries",price:55,category:"Food",emoji:"🍟",available:true},
{id:6,name:"Coffee",price:35,category:"Drinks",emoji:"☕",available:true},
{id:7,name:"Fresh Juice",price:50,category:"Drinks",emoji:"🥤",available:true},
{id:8,name:"Sandwich",price:70,category:"Food",emoji:"🥪",available:true}
];

let products=JSON.parse(localStorage.getItem("products"))||defaultProducts;
let orders=JSON.parse(localStorage.getItem("orders"))||[];
let cart=[];
let paymentMethod=null;

function save(){
localStorage.setItem("products",JSON.stringify(products));
localStorage.setItem("orders",JSON.stringify(orders));
}

function todayOrders(){
const today=new Date().toDateString();
return orders.filter(o=>new Date(o.time).toDateString()===today);
}

function todayTotal(){
return todayOrders().reduce((s,o)=>s+o.total,0);
}

function paymentTotal(method){
return todayOrders()
.filter(o=>o.payment===method)
.reduce((s,o)=>s+o.total,0);
}

function showPage(page,button){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(page).classList.add("active");

document.querySelectorAll("nav button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

if(page==="admin")renderAdmin();
if(page==="dashboard")renderDashboard();
if(page==="history")renderHistory();

}

function renderProducts(){

const grid=document.getElementById("productGrid");
grid.innerHTML="";

products.forEach(p=>{

const div=document.createElement("div");

div.className="product"+(!p.available?" sold":"");

div.onclick=()=>{
if(p.available)addToCart(p.id);
};

div.innerHTML=`
<div class="emoji">${p.emoji||"🍽️"}</div>
<h3>${p.name}</h3>
<div class="price">MVR ${Number(p.price).toFixed(2)}</div>
<small>${p.available?"":"SOLD OUT"}</small>
`;

grid.appendChild(div);

});

document.getElementById("headerSales").innerText=
"MVR "+todayTotal().toFixed(2);

}

function addToCart(id){

const p=products.find(x=>x.id===id);
if(!p||!p.available)return;

const item=cart.find(x=>x.id===id);

if(item)item.qty++;
else cart.push({...p,qty:1});

renderCart();

}

function changeQty(id,n){

const item=cart.find(x=>x.id===id);
if(!item)return;

item.qty+=n;

if(item.qty<=0)
cart=cart.filter(x=>x.id!==id);

renderCart();

}

function renderCart(){

const box=document.getElementById("cartItems");

if(!cart.length){

box.innerHTML='<div class="empty">No products added</div>';

}else{

box.innerHTML=cart.map(item=>`

<div class="cart-item">

<div class="item-info">
<div class="item-name">${item.name}</div>
<div class="item-price">
MVR ${(item.price*item.qty).toFixed(2)}
</div>
</div>

<div class="qty">
<button onclick="changeQty(${item.id},-1)">−</button>
<span>${item.qty}</span>
<button onclick="changeQty(${item.id},1)">+</button>
</div>

</div>

`).join("");

}

updateTotal();

}

function getTotal(){
return cart.reduce((sum,x)=>sum+x.price*x.qty,0);
}

function updateTotal(){

document.getElementById("total").innerText=
"MVR "+getTotal().toFixed(2);

document.getElementById("checkout").disabled=
!cart.length||!paymentMethod;

}

function selectPayment(method){

paymentMethod=method;

document.querySelectorAll(".payment button")
.forEach(b=>b.classList.remove("active"));

document.getElementById(method.toLowerCase())
.classList.add("active");

updateTotal();

}

function checkout(){

if(!cart.length||!paymentMethod)return;

const now=new Date();

const order={
id:Date.now(),
number:"ORD-"+String(orders.length+1).padStart(4,"0"),
time:now.toISOString(),
payment:paymentMethod,
items:cart.map(x=>({
name:x.name,
price:x.price,
qty:x.qty
})),
total:getTotal()
};

orders.unshift(order);

save();

cart=[];
paymentMethod=null;

document.querySelectorAll(".payment button")
.forEach(b=>b.classList.remove("active"));

renderCart();
renderProducts();

showReceipt(order);

}

function showReceipt(order){

const date=new Date(order.time);

document.getElementById("printArea").innerHTML=`

<div class="receipt">

<h2>🍰 Bakery</h2>

<p>Thank you for your order!</p>

<hr style="margin:15px 0">

<strong>${order.number}</strong>

<p style="font-size:13px;margin-top:5px">
${date.toLocaleDateString()} ${date.toLocaleTimeString()}
</p>

<div class="receipt-items">

${order.items.map(item=>`

<div class="receipt-row">
<span>${item.name} × ${item.qty}</span>
<span>MVR ${(item.price*item.qty).toFixed(2)}</span>
</div>

`).join("")}

</div>

<div class="receipt-total">

<div class="receipt-row">
<span>TOTAL</span>
<span>MVR ${order.total.toFixed(2)}</span>
</div>

</div>

<p style="margin-top:15px">
Payment: <strong>${order.payment}</strong>
</p>

<p style="margin-top:20px">
Thank you ❤️
</p>

</div>

`;

document.getElementById("receiptModal")
.classList.add("show");

}

function closeReceipt(){
document.getElementById("receiptModal")
.classList.remove("show");
}

function printReceipt(){
window.print();
}

function renderHistory(){

const box=document.getElementById("orders");

if(!orders.length){

box.innerHTML='<div class="empty">No orders yet</div>';
return;

}

box.innerHTML=orders.map(o=>{

const date=new Date(o.time);

return`

<div class="order">

<div class="order-top">

<div>
<strong>${o.number}</strong>
<br>
<small>
${date.toLocaleDateString()}
${date.toLocaleTimeString()}
</small>
</div>

<strong>MVR ${o.total.toFixed(2)}</strong>

</div>

<div class="order-items">

${o.items.map(i=>`${i.name} × ${i.qty}`).join(", ")}

</div>

<div class="order-bottom">

<span>💳 ${o.payment}</span>

<div>
<button onclick='showReceiptById(${o.id})'>
🧾 Receipt
</button>

<button onclick="deleteOrder(${o.id})">
🗑️
</button>
</div>

</div>

</div>

`;

}).join("");

}

function showReceiptById(id){

const order=orders.find(o=>o.id===id);

if(order)showReceipt(order);

}

function deleteOrder(id){

if(!confirm("Delete this order from history?"))return;

orders=orders.filter(o=>o.id!==id);

save();

renderHistory();
renderDashboard();
renderProducts();

}

function renderDashboard(){

document.getElementById("dashSales").innerText=
"MVR "+todayTotal().toFixed(2);

document.getElementById("dashOrders").innerText=
todayOrders().length;

document.getElementById("dashCash").innerText=
"MVR "+paymentTotal("Cash").toFixed(2);

document.getElementById("dashCard").innerText=
"MVR "+paymentTotal("Card").toFixed(2);

document.getElementById("dashTransfer").innerText=
"MVR "+paymentTotal("Transfer").toFixed(2);

document.getElementById("dashProducts").innerText=
products.length;

}

function addProduct(){

const name=document.getElementById("newName").value.trim();
const price=Number(document.getElementById("newPrice").value);
const category=document.getElementById("newCategory").value;
const emoji=document.getElementById("newEmoji").value||"🍽️";

if(!name||price<=0){

alert("Please enter product name and price.");
return;

}

products.push({
id:Date.now(),
name,
price,
category,
emoji,
available:true
});

save();

document.getElementById("newName").value="";
document.getElementById("newPrice").value="";
document.getElementById("newEmoji").value="";

renderAdmin();
renderProducts();

alert("Product added!");

}

function renderAdmin(){

const box=document.getElementById("adminProducts");

if(!products.length){

box.innerHTML='<div class="empty">No products</div>';
return;

}

box.innerHTML=products.map(p=>`

<div class="admin-product">

<div>
<strong>${p.emoji} ${p.name}</strong>
<div>MVR ${Number(p.price).toFixed(2)} • ${p.category}</div>
<small>${p.available?"Available":"Sold Out"}</small>
</div>

<div class="admin-actions">

<button class="edit"
onclick="editProduct(${p.id})">✏️</button>

<button class="sold-btn"
onclick="toggleProduct(${p.id})">
${p.available?"🔴":"🟢"}
</button>

<button class="delete"
onclick="deleteProduct(${p.id})">🗑️</button>

</div>

</div>

`).join("");

}

function editProduct(id){

const p=products.find(x=>x.id===id);

const name=prompt("Product name:",p.name);
if(name===null)return;

const price=prompt("Price:",p.price);
if(price===null)return;

const emoji=prompt("Emoji:",p.emoji);

p.name=name.trim()||p.name;
p.price=Number(price)||p.price;
p.emoji=emoji||p.emoji;

save();

renderAdmin();
renderProducts();

}

function toggleProduct(id){

const p=products.find(x=>x.id===id);

p.available=!p.available;

save();

renderAdmin();
renderProducts();

}

function deleteProduct(id){

if(!confirm("Delete this product?"))return;

products=products.filter(x=>x.id!==id);

save();

renderAdmin();
renderProducts();

}

renderProducts();
renderCart();

</script>

</body>
</html>
